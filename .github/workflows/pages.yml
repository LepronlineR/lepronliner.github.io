name: Build and Publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Disable Jekyll on published site
        run: New-Item -ItemType File -Force public/.nojekyll
        shell: pwsh

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add gh-pages-worktree origin/gh-pages
          git -C gh-pages-worktree rm -r --ignore-unmatch .
          cp -R public/. gh-pages-worktree/
          git -C gh-pages-worktree add .
          git -C gh-pages-worktree commit -m "Publish site" || exit 0
          git -C gh-pages-worktree push origin HEAD:gh-pages

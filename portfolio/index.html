<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small 3D island where every landmark leads to a part of Zhi Zheng's site.">
    <title>Island Demo | Zhi Zheng</title>
    <!-- include:head -->
    <!-- include:three -->
  </head>
  <body class="interactive-page">
    <!-- include:header interactive -->

    <main id="main">
      <section class="island-stage" data-island aria-label="Interactive island demo">
        <canvas class="scene-canvas" aria-hidden="true"></canvas>
        <div class="scene-labels"></div>
        <div class="scene-loader" aria-hidden="true">Loading</div>
        <p class="scene-fallback">
          The 3D scene could not start in this browser. The landmarks below still work as links.
        </p>

        <aside class="scene-card" aria-live="polite" hidden></aside>

        <nav class="scene-dock" aria-label="Island landmarks">
          <p class="scene-hint">Drag to look around &middot; Scroll or pinch to zoom</p>
          <div class="scene-chips">
            <a class="scene-chip" data-anchor="about" href="/#experience"><kbd>1</kbd>About</a>
            <a class="scene-chip" data-anchor="projects" href="/projects/"><kbd>2</kbd>Projects</a>
            <a class="scene-chip" data-anchor="blog" href="/blog/"><kbd>3</kbd>Blog</a>
            <a class="scene-chip" data-anchor="resume" href="/resume/"><kbd>4</kbd>R&eacute;sum&eacute;</a>
          </div>
        </nav>

        <p class="scene-credit">
          Models by <a href="https://opengameart.org/users/pistachio" target="_blank" rel="noopener noreferrer">pistachio</a>, CC-BY
        </p>
      </section>
    </main>

    <script src="/scripts/theme.js" defer></script>
    <script type="module" src="/scripts/main.js"></script>
    <script type="module" src="/scripts/island-page.js"></script>
  </body>
</html>
